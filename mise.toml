min_version = "2025.1.0"

[tools]
node = "24.21.0"
emsdk = "6.0.10"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.bootstrap]
description = "Install pinned toolchain, locked npm dependencies, and Playwright Chromium"
run = '''
npm ci
npx playwright install chromium
'''

[tasks."fetch-native"]
description = "Fetch, verify, patch and extract the pinned Hamlib release"
run = "node packages/hamlib-web/build/fetch-native.ts"

[tasks."build:native"]
description = "Compile the fetched Hamlib release to WebAssembly"
depends = ["fetch-native"]
run = "node packages/hamlib-web/build/compile-native.ts"

[tasks.generate]
description = "Regenerate the binding surface from hamlib.config.yaml and the upstream AST"
depends = ["fetch-native"]
run = "node packages/hamlib-web/build/codegen.ts --update"

[tasks."build:package"]
description = "Compile the public TypeScript package against the generated Embind declarations"
depends = ["build:native"]
run = "node packages/hamlib-web/build/package.ts"

[tasks."build:example"]
description = "Build the Vanilla TypeScript/Vite example"
depends = ["build:package"]
run = "npm run build --workspace examples/basic"

[tasks."build:harness"]
description = "Build the browser test harness app"
depends = ["build:package"]
run = "npm run build --workspace tests/harness"

[tasks.build]
description = "Full reproducible build: native Wasm, package, example"
depends = ["build:example"]

[tasks."typecheck:consumer"]
description = "Pack the package and install the tarball into the consumer fixture"
depends = ["build:package"]
run = '''
set -e
rm -rf tests/consumer/packed tests/consumer/node_modules
mkdir -p tests/consumer/packed
npm pack --workspace packages/hamlib-web --pack-destination tests/consumer/packed
tarball=$(ls tests/consumer/packed/*.tgz)
mv "$tarball" tests/consumer/packed/hamlib-web.tgz
npm install --prefix tests/consumer --no-audit --no-fund --no-package-lock
'''

[tasks."typecheck:projects"]
description = "Typecheck every project from the repository root"
depends = ["typecheck:consumer"]
run = '''
set -e
tsc -p packages/hamlib-codegen/tsconfig.json --noEmit
tsc -p packages/hamlib-web/tsconfig.json --noEmit
tsc -p packages/hamlib-web/tsconfig.build.json --noEmit
tsc -p packages/hamlib-web/native/tsconfig.library.json --noEmit
tsc -p examples/basic/tsconfig.json --noEmit
tsc -p tests/harness/tsconfig.json --noEmit
tsc -p tests/browser/tsconfig.json --noEmit
tsc -p tests/browser/fixtures/tsconfig.json --noEmit
tsc -p tests/consumer/tsconfig.json --noEmit
'''

[tasks.typecheck]
description = "Typecheck every workspace project, including the packed-package consumer fixture"
depends = ["typecheck:projects"]

[tasks.test]
description = "Run deterministic transport/lifecycle checks and the Playwright scenarios"
depends = ["build:example", "build:harness"]
run = "npx playwright test"

[tasks."test:browser"]
description = "Run only the example-driven Playwright browser scenarios"
depends = ["build:example", "build:harness"]
run = "npx playwright test tests/browser/e2e"

[tasks."baseline:record"]
description = "Re-record the upstream behavioural baseline from the current build"
depends = ["build:example", "build:harness"]
run = "HAMLIBS_WEB_RECORD_BASELINE=1 npx playwright test tests/browser/baseline.spec.ts"

[tasks."audit:backends"]
description = "Audit the pinned backends for threads, unwritable line settings and port-layer bypasses"
depends = ["fetch-native"]
run = "node packages/hamlib-web/build/audit-backends.ts"

[tasks."compare:native"]
description = "Build the pinned release for the host and compare a representative transaction with the browser baseline"
run = "node packages/hamlib-web/build/compare-native.ts"

[tasks.refresh]
description = "Upstream refresh: fetch, adapt, generate, build, typecheck, browser checks and packed-consumer check"
depends = ["build", "build:harness", "audit:backends", "typecheck", "test"]

[tasks."pack:check"]
description = "Verify the published package contents"
depends = ["build:package"]
run = "npm pack --dry-run --workspace packages/hamlib-web"

[tasks.dev]
description = "Run the example dev server on a localhost URL"
depends = ["build:package"]
run = "npm run dev --workspace examples/basic"
