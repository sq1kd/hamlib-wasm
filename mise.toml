min_version = "2025.1.0"

[tools]
node = "24.21.0"
emsdk = "6.0.10"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.bootstrap]
description = "Install the pinned toolchain, locked dependencies, Playwright Chromium and the commit hook"
run = '''
npm ci
npx playwright install chromium
git config core.hooksPath .githooks
'''

[tasks.fetch-native]
description = "Fetch, verify, patch and extract the pinned Hamlib release"
run = "npm run fetch-native"

[tasks.build-native]
description = "Compile the fetched Hamlib release to WebAssembly"
depends = ["fetch-native"]
run = "npm run build-native"

[tasks.generate]
description = "Regenerate the binding surface from hamlib.config.yaml and the upstream AST"
depends = ["fetch-native"]
run = "npm run generate"

[tasks.build-package]
description = "Compile the public TypeScript package and render licensing artifacts"
depends = ["build-native"]
run = "npm run build-package"

[tasks.build-example]
description = "Build the Vanilla TypeScript/Vite example"
depends = ["build-package"]
run = "npm run build-example"

[tasks.build-react]
description = "Build the React landing page and demo application"
depends = ["build-package"]
run = "npm run build-react"

[tasks.build-harness]
description = "Build the browser test harness app"
depends = ["build-package"]
run = "npm run build-harness"

[tasks.example-node]
description = "List the serial ports this machine reports, through the Node entry point"
depends = ["build-package"]
run = "npm run example-node"

[tasks.build]
description = "Full reproducible build: native Wasm, package, examples"
depends = ["build-example", "build-react"]
run = "true"

[tasks.typecheck-consumer]
description = "Pack the package and install the tarball into the consumer fixture"
depends = ["build-package"]
run = "npm run typecheck-consumer"

[tasks.typecheck-workspace]
description = "Typecheck every project from the repository root"
depends = ["typecheck-consumer"]
run = "npm run typecheck-workspace"

[tasks.typecheck]
description = "Typecheck every workspace project, prove the generated bindings are current, and check the packed consumer"
depends = ["check-generated", "typecheck-workspace"]
run = "true"

[tasks.test-hooks]
description = "Run the DOM-less React hook unit tests against a stubbed package boundary"
depends = ["build-package"]
run = "npm run test-hooks"

[tasks.test-node]
description = "Run the Node transport checks against the built package"
depends = ["build-package"]
run = "npm run test-node"

[tasks.test-codegen]
description = "Run the hamlib-codegen unit tests against synthetic clang ASTs and a committed Embind declaration"
run = "npm run test-codegen"

[tasks.docs-check]
description = "Fail when README/docs name a mise task or layout path that does not exist"
run = "npm run docs-check"

[tasks.check-generated]
description = "Fail when the committed generated bindings differ from what the generator emits"
depends = ["fetch-native"]
run = "npm run check-generated"

[tasks.lint]
description = "Lint every source with Biome (formatter intentionally disabled)"
run = "npm run lint"

[tasks.test-hardware]
description = "Run the read-only checks against a real rig (HAMLIB_WASM_HARDWARE_DEVICE=qmx|ft-710, or HAMLIB_WASM_HARDWARE_PORT=<path>; HAMLIB_WASM_HARDWARE_WRITE=1 adds the frequency round-trip)"
depends = ["build-package"]
run = "npm run test-hardware"

[tasks.test]
description = "Run the hook and Node transport unit tests, the transport/lifecycle checks and the Playwright scenarios"
depends = ["build-example", "build-react", "build-harness", "test-hooks", "test-node", "test-codegen"]
run = "npx playwright test"

[tasks.test-browser]
description = "Run only the example-driven Playwright browser scenarios"
depends = ["build-example", "build-harness", "build-react"]
run = "npm run test-browser"

[tasks.baseline-record]
description = "Re-record the upstream behavioural baseline from the current build"
depends = ["build-example", "build-harness", "build-react"]
run = "npm run baseline-record"

[tasks.audit-backends]
description = "Audit the pinned backends for threads, unwritable line settings and port-layer bypasses"
depends = ["fetch-native"]
run = "npm run audit-backends"

[tasks.compare-native]
description = "Build the pinned release for the host and compare a representative transaction with the browser baseline"
run = "npm run compare-native"

[tasks.check]
description = "The local gate before pushing: lint, typecheck, generated check, unit tests and the browser suite"
run = '''
# Sequential on purpose: `typecheck` packs the package and `test` rebuilds it,
# so running them in parallel would race over `dist`.
mise run lint
mise run docs-check
mise run typecheck
mise run test
'''

[tasks.check-release]
description = "Everything a publish needs: check, the packed tarball audit and the backend audit"
run = '''
mise run check
mise run verify-package
mise run audit-backends
'''

[tasks.release-guard]
description = "Fail when a Hamlib release-block change is not a feat/fix commit"
run = "npm run release-guard"

[tasks.release-dry-run]
description = "Report the next semantic-release version without publishing (needs GITHUB_TOKEN and a remote)"
run = "npm run release-dry-run"

[tasks.refresh]
description = "Upstream refresh: generate, build, typecheck, browser checks and the packed-consumer check"
depends = ["fetch-native"]
run = '''
# Sequential on purpose: `generate` writes the files the build and the
# generated-binding check read, and mise runs independent dependencies in
# parallel.
mise run generate
mise run build
mise run build-harness
mise run audit-backends
mise run typecheck
mise run test
'''

[tasks.pack-package]
description = "Verify the published package contents"
depends = ["build-package"]
run = "npm run pack-package"

[tasks.verify-package]
description = "Verify the actual npm tarball, notices, hashes, link inputs and source kit"
depends = ["build-package"]
run = "npm run verify-package"

[tasks.verify-relink]
description = "Rebuild the packed package with modified Hamlib and exercise it through the loader"
depends = ["build-package"]
run = "npm run verify-relink"

[tasks.verify-release]
description = "Run package and relink verification concurrently against one packed tarball"
depends = ["build-package"]
run = "npm run verify-release"

[tasks.release-bump]
description = "Update the pinned Hamlib release in hamlib.config.yaml"
run = "npm run release-bump --"

[tasks.dev]
description = "Run the Vanilla example dev server on a localhost URL"
depends = ["build-package"]
run = "npm run dev"

[tasks.dev-react]
description = "Run the React landing page dev server on a localhost URL"
depends = ["build-package"]
run = "npm run dev-react"
