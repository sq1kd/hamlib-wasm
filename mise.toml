min_version = "2026.8.0"

[tools]
node = "24.21.0"
emsdk = "6.0.10"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[vars]
browsers = "chromium firefox"

# Every task runs from the repository root.  A task named in several places of
# one `mise run` graph runs once, so composite tasks are plain `depends` lists.
# `wait_for` orders a task after another only when both are in the same run:
# `refresh` regenerates the bindings before anything reads them.

# --- Setup -------------------------------------------------------------------

[tasks.bootstrap]
description = "Install the locked dependencies, Playwright Chromium and Firefox, and the commit hook"
run = [
  "npm ci",
  { task = "install-browsers" },
  "git config core.hooksPath .githooks",
]

[tasks.install-browsers]
description = "Install the Playwright browsers the browser suite runs"
run = "playwright install {{vars.browsers}}"

[tasks.install-browser-deps]
description = "Install the operating-system packages those browsers need (Linux, uses sudo)"
run = "playwright install-deps {{vars.browsers}}"

# --- Native build and generated bindings -------------------------------------

[tasks.fetch-native]
description = "Fetch, verify, patch and extract the pinned Hamlib release"
run = "node packages/hamlib-wasm/build/fetch-native.ts"

[tasks.generate]
description = "Regenerate the binding surface from hamlib.config.yaml and the upstream AST"
depends = ["fetch-native"]
run = "node packages/hamlib-wasm/build/codegen.ts --update"

[tasks.check-generated]
description = "Fail when the committed generated bindings differ from what the generator emits"
depends = ["fetch-native"]
wait_for = ["generate"]
run = "node packages/hamlib-wasm/build/codegen.ts --check"

[tasks.build-native]
description = "Compile the fetched Hamlib release to WebAssembly"
depends = ["fetch-native", "check-generated"]
wait_for = ["generate"]
run = "node packages/hamlib-wasm/build/compile-native.ts"

[tasks.audit-backends]
description = "Audit the pinned backends for threads, unwritable line settings and port-layer bypasses"
depends = ["fetch-native"]
run = "node packages/hamlib-wasm/build/audit-backends.ts"

[tasks.compare-native]
description = "Build the pinned release for the host and compare a representative transaction with the browser baseline"
run = "node packages/hamlib-wasm/build/compare-native.ts"

[tasks.release-bump]
description = "Update the pinned Hamlib release in hamlib.config.yaml (mise run release-bump -- --version ...)"
run = "node packages/hamlib-wasm/build/release-bump.ts"

# --- Package and apps --------------------------------------------------------

[tasks.build-package]
description = "Compile the public TypeScript package and render licensing artifacts"
depends = ["build-native"]
run = "node packages/hamlib-wasm/build/package.ts"

[tasks.build-site]
description = "Build the documentation site: astro check, TypeDoc API reference, static build"
depends = ["build-package"]
run = "npm run build --workspace site"

[tasks.build-harness]
description = "Build the browser test harness app"
depends = ["build-package"]
run = "npm run build --workspace tests/harness"

[tasks.build]
description = "Full reproducible build: native Wasm, package, documentation site and the test harness"
depends = ["build-site", "build-harness"]

[tasks.dev-site]
description = "Run the documentation site dev server on http://127.0.0.1:5176/"
depends = ["build-package"]
run = "npm run dev --workspace site"

[tasks.preview-site]
description = "Serve the built documentation site on http://127.0.0.1:4176/"
depends = ["build-site"]
run = "npm run preview --workspace site"

[tasks.example-node]
description = "List the serial ports this machine reports, through the Node entry point"
depends = ["build-package"]
run = "node examples/node/src/main.ts --list"

# --- Static checks -----------------------------------------------------------

[tasks.lint]
description = "Lint every source with Biome (formatter intentionally disabled)"
run = "biome lint ."

[tasks.lint-commits]
description = "Lint commit messages with commitlint (mise run lint-commits -- --from <rev>)"
run = "commitlint --verbose"

[tasks.guard]
description = "Fail when a build script declares a path outside paths.ts or a file hardcodes the pinned release"
run = "node packages/hamlib-wasm/build/guard.ts"

[tasks.docs-check]
description = "Fail when README/docs name a mise task or layout path that does not exist"
run = "node packages/hamlib-wasm/build/docs-check.ts"

[tasks.typecheck-consumer]
description = "Pack the package and install the tarball into the consumer fixture"
depends = ["build-package"]
run = "node packages/hamlib-wasm/build/typecheck-consumer.ts"

[tasks.typecheck]
description = "Typecheck every project (tsc -b) and check the packed consumer"
depends = ["typecheck-consumer"]
run = "tsc -b --noEmit"

# --- Tests -------------------------------------------------------------------

[tasks.test-codegen]
description = "Run the hamlib-codegen unit tests against synthetic clang ASTs and a committed Embind declaration"
run = "vitest run --config tests/codegen/vitest.config.ts"

[tasks.test-hooks]
description = "Run the DOM-less React hook unit tests against a stubbed package boundary"
depends = ["build-package"]
run = "vitest run --config tests/hooks/vitest.config.ts"

[tasks.test-node]
description = "Run the Node transport checks against the built package"
depends = ["build-package"]
run = "vitest run --config tests/node/vitest.config.ts"

[tasks.test-hardware]
description = "Run the read-only checks against a real rig (HAMLIB_WASM_HARDWARE_DEVICE=qmx|ft-710, or HAMLIB_WASM_HARDWARE_PORT=<path>; HAMLIB_WASM_HARDWARE_WRITE=1 adds the frequency round-trip, HAMLIB_WASM_HARDWARE_TRANSMIT=dummy-load the PTT test)"
depends = ["build-package"]
run = "vitest run --config tests/hardware/vitest.config.ts"

[tasks.test-browser]
description = "Run only the example-driven Playwright browser scenarios"
depends = ["build"]
run = "playwright test tests/browser/e2e"

[tasks.test]
description = "Run the hook, codegen and Node unit tests, then every Playwright scenario"
depends = ["build", "test-hooks", "test-node", "test-codegen"]
run = "playwright test"

[tasks.baseline-record]
description = "Re-record the upstream behavioural baseline from the current build"
depends = ["build"]
env = { HAMLIB_WASM_RECORD_BASELINE = "1" }
run = "playwright test tests/browser/baseline.spec.ts --project chromium"

# --- Gates -------------------------------------------------------------------

[tasks.check]
description = "The local gate before pushing: lint, docs, repository guard, typecheck, generated check, unit tests and the browser suite"
depends = ["lint", "docs-check", "guard", "typecheck", "test"]

[tasks.check-release]
description = "Everything a publish needs: check, the packed tarball audit and the backend audit"
depends = ["check", "verify-package", "audit-backends"]

[tasks.refresh]
description = "Upstream refresh: generate, build, audit, typecheck and every test"
depends = ["generate", "audit-backends", "typecheck", "test"]

# --- Package verification and release ----------------------------------------

[tasks.verify-package]
description = "Verify the actual npm tarball, notices, hashes, link inputs and source kit"
depends = ["build-package"]
run = "node packages/hamlib-wasm/build/verify-package.ts"

[tasks.verify-relink]
description = "Rebuild the packed package with modified Hamlib and exercise it through the loader"
depends = ["build-package"]
run = "node packages/hamlib-wasm/build/verify-relink.ts"

[tasks.verify-release]
description = "Pack once, verify the package and run the clean-room relink against the same tarball (semantic-release runs this before it publishes)"
depends = ["build-package"]
run = "node packages/hamlib-wasm/build/verify-package.ts --relink"

[tasks.release-guard]
description = "Fail when a commit changes the Hamlib release block without releasing (mise run release-guard -- --from <rev> --to <rev>)"
run = "node packages/hamlib-wasm/build/release-commit-guard.ts"

[tasks.save-build-outputs]
description = "Archive the package build's outputs for a later CI job"
run = "node packages/hamlib-wasm/build/build-outputs.ts --save"

[tasks.restore-build-outputs]
description = "Unpack the archived package build into this checkout"
run = "node packages/hamlib-wasm/build/build-outputs.ts --restore"

[tasks.release]
description = "Publish with semantic-release in CI; elsewhere a dry run that reports the next version and notes"
run = "semantic-release"
