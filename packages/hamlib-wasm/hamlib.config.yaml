# The binding surface of packages/hamlib-wasm, and the upstream release it binds.
#
# One file, two readers: the native build reads `release:`
# (packages/hamlib-wasm/build/upstream.ts) and the generator reads the rest
# (packages/hamlib-codegen).  Nothing here is rewritten by a tool.
#
# After changing this file run `mise run generate`; the native build and
# `mise run typecheck` fail when the committed generated artifacts are stale.

# The pinned upstream release: the archive the native build downloads and
# verifies, and the patches it applies.  Everything that identifies a release
# lives here.
release:
  version: 4.7.2
  series: "4.7"
  repository: https://github.com/Hamlib/Hamlib
  commit: 40f63488fe0bd751b147f48d62fd217bf53713a0
  tagObject: f4fe0e5feab233cf45606f63d7f2fdcb7d5579dc
  archive:
    name: hamlib-4.7.2.tar.gz
    url: https://github.com/Hamlib/Hamlib/releases/download/4.7.2/hamlib-4.7.2.tar.gz
    sha256: ae1fcf2dbc80ea0786ea8f047b09399c3f7737d1930442f61a031708ed33e88f
  license: LGPL-2.1-or-later
  patches:
    - file: hamlib-4.7.2-web.patch
      purpose: "Skip the Morse worker start in rig_open(): the browser build has no pthreads, and without this the worker's thread creation would fail the whole open. Register only serial-port rig models on Emscripten: the network, parallel, device and dummy models cannot be opened here, the facade already hides them, and leaving them unregistered lets the linker drop their code. No other upstream source change."

# Value objects the Embind boundary returns whose C++ structs are declared in
# native/facade.cpp.  The generator registers them; it never defines them.
# The generated single-output results (NumberResult, TextResult and the
# per-operation Get*Result structs) are derived from the AST instead.
results:
  ModelInfo:
    binding: RigModelInfo
    fields:
      - [ id, int ]
      - [ manufacturer, string ]
      - [ model, string ]
      - [ backendVersion, string ]
      - [ status, int ]
      - [ serialRateMin, int ]
      - [ serialRateMax, int ]
      - [ serialDataBits, int ]
      - [ serialStopBits, int ]
      - [ serialParity, string ]
      - [ serialHandshake, string ]
      # canGetFrequency/canSetFrequency/canGetMode/canSetMode are deliberately
      # absent: the capability list already carries the generated operation, so
      # the catalogue derives those four booleans from it.  PTT stays here
      # because a backend that drives it over the RTS/DTR line declares no
      # get_ptt/set_ptt function pointer.
      - [ canGetPtt, bool ]
      - [ canSetPtt, bool ]
      # The backend's own send_morse/stop_morse.  Hamlib's rig_send_morse only
      # queues for a worker thread this build does not start, so the facade
      # calls these directly and the catalogue says whether they exist.
      - [ canSendMorse, bool ]
      - [ canStopMorse, bool ]
  CodeResult:
    fields:
      - [ code, int ]
      - [ error, string ]
  OpenResult:
    fields:
      - [ code, int ]
      - [ handle, int ]
      - [ error, string ]
  PttResult:
    fields:
      - [ code, int ]
      - [ ptt, string, PttState ]
      - [ error, string ]

# Embind vector registrations.  `ModelInfo` is a C++ struct declared in
# native/facade.cpp; `RigConfparams` is the projection the generator derives
# from upstream `struct confparams`.  Neither element type can be named from
# the config alone, so both are listed here.
vectors:
  - type: ModelInfo
    binding: RigModelList
  - type: RigConfparams
    binding: RigConfparamsList

# Operations whose C++ body is hand-written in native/facade.cpp, because a
# signature cannot describe them: the module lifecycle, port registration and
# open/close ownership (scope: module), plus the out-buffer, callback-walker,
# extended-setting and PTT operations (scope: rig).  `calls` lists the upstream
# symbols the body uses; those symbols are excluded from generation and their
# pinned signatures are recorded in coverage.json, so a drift fails the build.
# `capability` names a ModelInfo flag the method is gated on, for the
# operations rig_caps cannot describe (serial RTS/DTR push-to-talk declares no
# get_ptt function pointer).  Everything else is classified from the upstream
# AST and generated end to end.
operations:
  - name: initialize
    scope: module
    args: []
    result: CodeResult
    calls:
      - rig_set_debug
      - rig_load_all_backends
  - name: version
    scope: module
    args: []
    result: string
    calls:
      - rig_version
  - name: listModels
    scope: module
    args: []
    result: ModelInfo[]
    calls:
      - rig_list_foreach
  - name: registerPort
    scope: module
    args:
      - [ logicalPath, string ]
      - [ portToken, int ]
    result: CodeResult
    calls: []
  - name: unregisterPort
    scope: module
    args:
      - [ logicalPath, string ]
    result: CodeResult
    calls: []
  - name: openRig
    scope: module
    args:
      - [ modelId, int ]
      - [ logicalPath, string ]
      - [ baudRate, int ]
      - [ conf, string ]
    result: OpenResult
    calls:
      - rig_get_caps
      - rig_init
      - rig_token_lookup
      - rig_set_conf
      - rig_open
      - rig_close
      - rig_cleanup
  # Opens the rig at one rate to find out whether it answers there, then closes
  # it again, so `detectBaudRate` can walk the rates a model declares without
  # paying a full open budget for each silent candidate.  Same upstream calls as
  # openRig; the facade applies a shortened port timeout and no retries.
  - name: probeBaudRate
    scope: module
    args:
      - [ modelId, int ]
      - [ logicalPath, string ]
      - [ baudRate, int ]
      - [ conf, string ]
    result: CodeResult
    calls:
      - rig_get_caps
      - rig_init
      - rig_token_lookup
      - rig_set_conf
      - rig_open
      - rig_close
      - rig_cleanup
  # Hamlib's debug output, routed to the JavaScript log hook at the given
  # rig_debug_level_e.  Global to the module, like Hamlib's own level.
  - name: setDebug
    scope: module
    args:
      - [ level, int ]
    result: CodeResult
    calls:
      - rig_set_debug
      - rig_set_debug_callback
  # One chunk of Morse, at most the backend's morse_qsize characters, sent
  # through its own send_morse; the value is how many characters went.  The
  # TypeScript layer loops over chunks so a long message never holds the call
  # queue, and stopMorse() can get in between.  The CW check also calls
  # rig_get_mode, deliberately not listed: `calls` excludes a symbol from
  # generation, and getMode is generated.
  - name: sendMorse
    scope: module
    args:
      - [ handle, int ]
      - [ text, string ]
      - [ checkMode, bool ]
    result: NumberResult
    calls: []
  - name: stopMorse
    scope: module
    args:
      - [ handle, int ]
    result: CodeResult
    calls: []
  # Bytes cross as hex, both ways: an Embind string is UTF-8, which would
  # mangle every byte above 0x7f.  `terminator` -1 and `replyLength` 0 mean
  # write only.
  - name: sendRaw
    scope: module
    args:
      - [ handle, int ]
      - [ data, string ]
      - [ terminator, int ]
      - [ replyLength, int ]
    result: TextResult
    calls:
      - rig_send_raw
  - name: closeRig
    scope: module
    args:
      - [ handle, int ]
    result: CodeResult
    calls:
      - rig_close
      - rig_cleanup
  # Releases everything the module owns: every rig still registered, the handle
  # map and the JavaScript port registry.  Called by dispose(); Wasm memory
  # itself is reclaimed when the module is collected.
  - name: destroy
    scope: module
    args: []
    result: CodeResult
    calls:
      - rig_close
      - rig_cleanup
  # Number of RIG handles currently registered.  A lifecycle probe: a test can
  # prove that closing and disposing really released the native side.
  - name: liveHandles
    scope: module
    args: []
    result: int
    calls: []
  - name: getPtt
    scope: rig
    capability: canGetPtt
    args:
      - [ handle, int ]
    result: PttResult
    calls:
      - rig_get_ptt
  - name: setPtt
    scope: rig
    capability: canSetPtt
    args:
      - [ handle, int ]
      - [ state, string, PttState ]
    result: PttResult
    calls:
      - rig_set_ptt
  - name: getRigInfo
    scope: rig
    args:
      - [ handle, int ]
    result: TextResult
    calls:
      - rig_get_rig_info
  - name: getExtLevel
    scope: rig
    args:
      - [ handle, int ]
      - [ token, double ]
    result: NumberResult
    calls:
      - rig_get_ext_level
  - name: setExtLevel
    scope: rig
    args:
      - [ handle, int ]
      - [ token, double ]
      - [ value, double ]
    result: CodeResult
    calls:
      - rig_set_ext_level
  - name: getExtParm
    scope: rig
    args:
      - [ handle, int ]
      - [ token, double ]
    result: NumberResult
    calls:
      - rig_get_ext_parm
  - name: setExtParm
    scope: rig
    args:
      - [ handle, int ]
      - [ token, double ]
      - [ value, double ]
    result: CodeResult
    calls:
      - rig_set_ext_parm
  - name: tokenForeach
    scope: rig
    args:
      - [ handle, int ]
    result: RigConfparams[]
    calls:
      - rig_token_foreach
  - name: extLevelForeach
    scope: rig
    args:
      - [ handle, int ]
    result: RigConfparams[]
    calls:
      - rig_ext_level_foreach
  - name: extFuncForeach
    scope: rig
    args:
      - [ handle, int ]
    result: RigConfparams[]
    calls:
      - rig_ext_func_foreach
  - name: extParmForeach
    scope: rig
    args:
      - [ handle, int ]
    result: RigConfparams[]
    calls:
      - rig_ext_parm_foreach

# Renames for the mechanically generated surface.  The generated names are
# the upstream symbols and parameters in camelCase (rig_get_split_freq ->
# getSplitFreq, tx_freq -> txFreq); a public name that still reads badly is
# renamed here rather than by hand-writing the operation.  Generation fails on
# an override that names nothing generated or renames nothing.
overrides:
  operations:
    rig_power2mW:
      method: powerToMilliwatts
      fields:
        mwpower: milliwatts
    rig_mW2power:
      method: milliwattsToPower
      fields:
        mwpower: milliwatts
    rig_get_freq:
      method: getFrequency
    rig_set_freq:
      method: setFrequency
    rig_get_mode:
      fields:
        width: passband
    rig_idx2setting:
      method: idxToSetting
    rig_setting2idx:
      method: settingToIdx
    rig_strvfo:
      method: strVfo
    rig_strlevel:
      method: strLevel
      fields:
        value0: level
    rig_strptrshift:
      method: strPtrShift
      fields:
        value0: shift
    rig_strrmode:
      method: strRmode
    rig_strstatus:
      method: strStatus
