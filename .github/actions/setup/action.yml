# SPDX-License-Identifier: MIT
#
# Shared job setup: the pinned mise toolchain (cached by mise-action), the
# locked npm dependencies, and on request the Hamlib inputs and the Playwright
# browsers.  Every workflow uses this, so the cache keys cannot drift and a
# release reuses what CI already cached.
name: setup
description: Install the toolchain and dependencies through mise

inputs:
  hamlib:
    description: Restore the cached Hamlib downloads and native build tree
    default: 'false'
  playwright:
    description: Restore or install the Playwright browsers
    default: 'false'

runs:
  using: composite
  steps:
    # ImageOS (e.g. ubuntu24) keys the caches whose contents are built for the
    # runner image, so a new image never restores binaries made for the old one.
    - name: Name the runner image
      id: image
      shell: bash
      run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

    - uses: jdx/mise-action@v5
      with:
        install: true
        cache: true

    - name: Restore the npm download cache
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install locked dependencies
      shell: bash
      run: npm ci

    # The native fetch/build is the expensive part.  The key covers every
    # input that can change the downloaded Hamlib tree or its compiled
    # artifacts; a partial restore is still useful after an unrelated edit.
    - name: Restore cached Hamlib sources and build tree
      if: inputs.hamlib == 'true'
      uses: actions/cache@v6
      with:
        path: .cache/hamlib
        key: hamlib-${{ steps.image.outputs.os }}-${{ hashFiles('packages/hamlib-wasm/hamlib.config.yaml', 'mise.toml', 'packages/hamlib-wasm/native/**', 'packages/hamlib-wasm/build/**') }}
        restore-keys: |
          hamlib-${{ steps.image.outputs.os }}-

    - name: Restore Playwright browsers
      id: playwright-cache
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.image.outputs.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright browsers on a cache miss
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: mise run install-browsers

    # The cache holds only the browsers; a fresh runner needs their system
    # packages every time.
    - name: Install the browsers' system packages
      if: inputs.playwright == 'true'
      shell: bash
      run: mise run install-browser-deps
