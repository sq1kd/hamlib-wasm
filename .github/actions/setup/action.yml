# SPDX-License-Identifier: MIT
#
# Shared job setup: the pinned mise toolchain (cached by mise-action), the
# locked npm dependencies, and on request the Hamlib inputs and Playwright
# Chromium.  Every workflow uses this, so the cache keys cannot drift and a
# release reuses what CI already cached.
name: setup
description: Install the toolchain and dependencies through mise

inputs:
  hamlib:
    description: Restore the cached Hamlib downloads and native build tree
    default: 'false'
  playwright:
    description: Restore or install Playwright Chromium
    default: 'false'

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
      with:
        install: true
        cache: true

    - name: Restore the npm download cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install locked dependencies
      shell: bash
      run: npm ci

    # The native fetch/build is the expensive part.  The key covers every
    # input that can change the downloaded Hamlib tree or its compiled
    # artifacts; a partial restore is still useful after an unrelated edit.
    - name: Restore cached Hamlib sources and build tree
      if: inputs.hamlib == 'true'
      uses: actions/cache@v4
      with:
        path: .cache/hamlib
        key: hamlib-${{ runner.os }}-${{ hashFiles('packages/hamlib-wasm/hamlib.config.yaml', 'mise.toml', 'packages/hamlib-wasm/native/**', 'packages/hamlib-wasm/build/**') }}
        restore-keys: |
          hamlib-${{ runner.os }}-

    - name: Restore Playwright browsers
      id: playwright-cache
      if: inputs.playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Chromium on a cache miss
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
