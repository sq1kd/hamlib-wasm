# SPDX-License-Identifier: MIT
name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint the pull request's commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise run lint-commits -- --from "$BASE" --to "$HEAD"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The specs open the site at /; without this the runner's
      # GITHUB_REPOSITORY gives it the Pages base.
      SITE_BASE: /
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          hamlib: 'true'
          playwright: 'true'

      - name: Run the release gate
        run: mise run check-release

      # release.yml publishes and deploys this exact build instead of
      # rebuilding it.
      - name: Keep the verified package build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: hamlib-wasm-dist
          path: packages/hamlib-wasm/dist
          retention-days: 7
