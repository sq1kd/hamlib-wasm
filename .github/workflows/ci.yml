# SPDX-License-Identifier: MIT
name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint the pull request's commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise run lint-commits -- --from "$BASE" --to "$HEAD"

      - name: Require a releasing type for a Hamlib release change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: mise run release-guard -- --from "$BASE" --to "$HEAD"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The specs open the site at /; without this the runner's
      # GITHUB_REPOSITORY gives it the Pages base.
      SITE_BASE: /
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          hamlib: 'true'
          playwright: 'true'

      - name: Run the release gate
        run: mise run check-release

      - name: Keep the Playwright traces of failed specs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      # release.yml publishes and deploys this exact build instead of
      # rebuilding it.
      - name: Archive the verified package build
        if: github.event_name == 'push'
        run: mise run save-build-outputs

      - name: Keep the verified package build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: hamlib-wasm-build
          path: .cache/build-outputs.tar.gz
          retention-days: 7
