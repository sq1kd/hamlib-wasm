# SPDX-License-Identifier: MIT
#
# Publishing uses npm Trusted Publishing (OIDC), not a publishing secret: the
# npm Trusted Publisher must name this repository and this workflow file.
name: release

on:
  push:
    branches: [main, next]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # semantic-release needs the full tag history to choose the version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No setup-node or registry URL: their generated .npmrc breaks npm's
      # OIDC authentication.  mise provides Node 24 and npm >= 11.5.1.
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: hamlib-wasm-build
          path: .cache

      - name: Restore the verified package build
        run: mise run restore-build-outputs

      # The package audit and clean-room relink run inside semantic-release
      # (verifyReleaseCmd), so only a push that publishes pays for them.
      - name: Publish and create the GitHub Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: hamlib-wasm-build
          path: .cache

      - name: Restore the verified package build
        run: mise run restore-build-outputs

      # Built here, not taken from ci: this build gets the Pages base from
      # GITHUB_REPOSITORY, the tested one is served at /.
      - name: Build the documentation site
        run: mise run --skip-deps build-site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v5
