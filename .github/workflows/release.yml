# SPDX-License-Identifier: MIT
#
# Publishing uses npm Trusted Publishing (OIDC), not a publishing secret: the
# npm Trusted Publisher must name this repository and this workflow file.
name: release

on:
  push:
    branches: [main, next]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # semantic-release needs the full tag history to choose the version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No setup-node or registry URL: their generated .npmrc breaks npm's
      # OIDC authentication.  mise provides Node 24 and npm >= 11.5.1.
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: hamlib-wasm-dist
          path: packages/hamlib-wasm/dist

      # The clean-room relink runs inside semantic-release (verifyReleaseCmd),
      # so only a push that publishes pays for it.
      - name: Publish and create the GitHub Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: hamlib-wasm-dist
          path: packages/hamlib-wasm/dist

      # Built here, not taken from ci: this build gets the Pages base from
      # GITHUB_REPOSITORY, the tested one is served at /.
      - name: Build the documentation site
        run: npm run build --workspace site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
